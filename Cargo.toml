[package]
name = "servo-bridge"
version = "0.0.4"
edition = "2021"
license = "MIT"
description = "提供給外部程式使用的 Servo C ABI 橋接函式庫"

[lib]
name = "servo_bridge"
crate-type = ["cdylib"]

[dependencies]
# 官方 Servo 並沒有可直接使用的 0.1 crates.io 套件，改用官方 release 原始碼。
# Servo v0.5.0 requires the 0.8.x CSP API. Pin the pre-0.8.3 release because
# 0.8.3 adds Destination::Text, which Servo v0.5.0 does not handle.
content-security-policy = "=0.8.1"
keyboard-types = { version = "0.8.3", features = ["serde", "webdriver"] }
servo = { git = "https://github.com/servo/servo.git", tag = "v0.5.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
# Servo v0.5.0 將 rsa 鎖定為 =0.10.0-rc.18，其依賴 pkcs1 ^0.8.0-rc.4 會解析到
# 不相容的 pkcs1 0.8.0-rc.5（RsaPrivateKey/RsaPublicKey 從生命週期參數改為泛型參數，
# 導致 E0107 編譯錯誤）。此處強制對齊 Servo 官方 Cargo.lock 使用的 pkcs1 0.8.0-rc.4。
# 等 Servo 升級到 rsa 0.10.0-rc.19 之後即可移除。
pkcs1 = "=0.8.0-rc.4"
surfman = { version = "0.13.0", features = ["chains"] }
dpi = "0.1.2"
euclid = "0.22.14"
url = "2.5.8"
