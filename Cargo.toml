[package]
name = "servo-lib"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "提供給外部程式使用的 Servo C ABI 橋接函式庫"

[lib]
name = "servo_bridge"
crate-type = ["cdylib"]

[dependencies]
# 官方 Servo 並沒有可直接使用的 0.1 crates.io 套件，改用固定版本的官方原始碼。
servo = { git = "https://github.com/servo/servo.git", rev = "c038a19febfd7ab687de71caf04cfe180462b70f", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }